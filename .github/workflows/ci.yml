name: CI
on: [push, pull_request]

jobs:
  checks:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bunx electrobun build
      - name: Check Python syntax and CLI
        shell: pwsh
        run: |
          python -m py_compile face-swap.py
          python face-swap.py --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 -File |
            Where-Object { $_.FullName -notmatch '[\\/](node_modules|build|artifacts)[\\/]' } |
            ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              if ($parseErrors.Count -gt 0) {
                $parseErrors | ForEach-Object { Write-Host "$($_.Extent.File): $($_.Message)" }
                $failed = $true
              }
            }
          if ($failed) { exit 1 }
      - name: Check POSIX script syntax
        if: runner.os == 'macOS'
        run: bash -n face-swap install.sh
